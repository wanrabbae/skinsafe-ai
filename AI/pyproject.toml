[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skinsafe-ai-service"
version = "0.3.0"
description = "Evidence-backed local ML and safety analysis service for SkinSafe AI"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi[standard-no-fastapi-cloud-cli]==0.139.0", "Pillow>=12,<13"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
skinsafe-train = "training.train_recommender:main"
skinsafe-evaluate-profile = "evaluation.evaluate_profile_intake:main"
skinsafe-evaluate-reviews = "evaluation.human_review:main"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools.packages.find]
include = ["app*", "evaluation*", "training*"]

[tool.setuptools.package-data]
evaluation = ["*.json"]
